<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Server-grade mobile viewport setup (Prevents zooming & fixes iPhone notch) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#070707">
    <title>Rare Window | Enter the Vibe</title>
    
    <!-- Enterprise-grade Font Preloading (Stops flickering) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Modular CSS Architecture -->
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="preloader.css">
</head>
<body>
        <!-- PHASE 1: THE REALISTIC 4D FRENCH DOORS PRELOADER -->
    <div id="vibe-preloader" class="preloader-container">
        
        <!-- 1. The Outer Solid Gold Arch Frame -->
        <div class="outer-gold-arch">
            
            <!-- 2. The Inner Vintage Wood Casing -->
            <div class="inner-wood-casing">
                
                <!-- 3. LEFT DOOR -->
                <div class="door left-door">
                    <div class="glass-pane"></div>
                    <!-- Wood Grids with Gold Trims -->
                    <div class="wood-grid vertical"></div>
                    <div class="wood-grid horizontal top"></div>
                    <div class="wood-grid horizontal bottom"></div>
                    <!-- 3D Round Handle -->
                    <div class="brass-handle left-handle"></div>
                </div>

                <!-- 4. RIGHT DOOR -->
                <div class="door right-door">
                    <div class="glass-pane"></div>
                    <!-- Wood Grids with Gold Trims -->
                    <div class="wood-grid vertical"></div>
                    <div class="wood-grid horizontal top"></div>
                    <div class="wood-grid horizontal bottom"></div>
                    <!-- 3D Round Handle -->
                    <div class="brass-handle right-handle"></div>
                </div>

            </div>

            <!-- 5. THE BRAND NAME (Emerges after 2 seconds) -->
            <h1 class="brand-title">RARE WINDOW</h1>

        </div>
        
        <!-- 6. INTERACTIVE ENTRY (Fades in last) -->
        <div class="tap-to-enter" id="enter-lounge-btn">
            <span class="pulse-text">Tap to Enter</span>
        </div>
    </div>
