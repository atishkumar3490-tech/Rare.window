       <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rare Window | The Premium Vibe</title>
    <link rel="stylesheet" href="preloader.css">
    <!-- Premium Font Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- THE 4D RENDER ENGINE CONTAINER -->
    <div id="vibe-preloader" class="preloader-container">
        
        <!-- 3D Perspective Stage -->
        <div class="stage-3d">
            
            <!-- STEP 1: The Outer Gold Arch (Grows from Bottom to Top) -->
            <div class="arch-frame">
                
                <!-- STEP 2: The Inner Wood & Doors -->
                <div class="doors-wrapper">
                    
                    <!-- LEFT DOOR -->
                    <div class="door left-door">
                        <div class="glass-pane"></div>
                        <div class="wood-grid vertical-grid"></div>
                        <div class="wood-grid horizontal-grid top-grid"></div>
                        <div class="wood-grid horizontal-grid bottom-grid"></div>
                        <div class="brass-knob left-knob"></div>
                    </div>

                    <!-- RIGHT DOOR -->
                    <div class="door right-door">
                        <div class="glass-pane"></div>
                        <div class="wood-grid vertical-grid"></div>
                        <div class="wood-grid horizontal-grid top-grid"></div>
                        <div class="wood-grid horizontal-grid bottom-grid"></div>
                        <div class="brass-knob right-knob"></div>
                    </div>

                </div>
            </div>

            <!-- STEP 3: The Brand Name (Front & Bold) -->
            <h1 class="brand-title">RARE<br>WINDOW</h1>
            
            <!-- STEP 4: Tap To Enter (Centered exactly between knobs) -->
            <div class="tap-to-enter">TAP TO ENTER</div>

        </div>
    </div>

</body>
</html>
